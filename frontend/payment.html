<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Autoride</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <header>
        <h1>Autoride</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <div class="auth-container" style="max-width: 500px;">
        <h2>Complete Payment</h2>
        
        <div style="background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; border: 1px solid var(--border-color); text-align: center;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Amount Due</p>
            <h3 style="font-size: 2rem; color: var(--primary-color);" id="amountDisplay">?0.00</h3>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label>Payment Method</label>
                <select id="method" name="method" class="form-input" required>
                    <option value="GCash">GCash</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Cash">Cash (Upon Pickup)</option>
                </select>
            </div>

            <div class="form-group" id="referenceGroup">
                <label>Reference Number (Optional)</label>
                <input type="text" id="referenceNumber" name="reference_number" class="form-input" placeholder="e.g. 1234567890">
            </div>

            <div class="form-group" id="fileGroup">
                <label>Upload Payment Proof (Receipt)</label>
                <input type="file" id="paymentProof" name="payment_proof" class="form-input" accept="image/*">
                <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Upload screenshot for GCash or Bank Transfer.</small>
            </div>

            <button type="submit" class="btn" id="submitBtn">Confirm Payment</button>
            <div id="message" style="margin-top: 1rem; text-align: center;"></div>
        </form>
    </div>

    <div class="modal-overlay" id="receiptModal">
        <div class="modal-content">
            <div class="receipt-paper">
                <div class="receipt-header">
                    <h2>AUTORIDE</h2>
                    <p style="font-size: 0.8rem; color: #666;">Official Receipt</p>
                </div>
                <div id="receiptContent">
                    <!-- Dynamic Content -->
                </div>
                <div class="receipt-total">
                    <div class="receipt-line">
                        <span>TOTAL PAID</span>
                        <span id="receiptTotal">₱0.00</span>
                    </div>
                </div>
                <button class="print-btn" onclick="window.print()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print Receipt
                </button>
                <button class="btn-outline" style="margin-top: 1rem; border: none; font-size: 0.85rem;" onclick="window.location.href='dashboard.html'">
                    Close & Go to Dashboard
                </button>
            </div>
        </div>
    </div>

    <script>
        const bookingId = localStorage.getItem('current_booking_id');
        const amount = localStorage.getItem('current_amount');
        const splitId = localStorage.getItem('paying_split_id');

        if (!bookingId || !amount) {
            alert('No active booking found. Returning to vehicles.');
            window.location.href = 'vehicles.html';
        }

        document.getElementById('amountDisplay').textContent = `₱${parseFloat(amount).toFixed(2)}`;
        
        if (splitId) {
            document.querySelector('h2').textContent = "Pay Your Split Share";
        }

        // Toggle file upload based on method
        document.getElementById('method').addEventListener('change', (e) => {
            const method = e.target.value;
            if (method === 'Cash') {
                document.getElementById('fileGroup').style.display = 'none';
                document.getElementById('referenceGroup').style.display = 'none';
            } else {
                document.getElementById('fileGroup').style.display = 'block';
                document.getElementById('referenceGroup').style.display = 'block';
            }
        });

        function showReceipt(receipt) {
            const content = document.getElementById('receiptContent');
            content.innerHTML = `
                <div class="receipt-line"><span>Ref No:</span> <strong>${receipt.reference_number}</strong></div>
                <div class="receipt-line"><span>Date:</span> <strong>${receipt.date}</strong></div>
                <div class="receipt-line"><span>Time:</span> <strong>${receipt.time}</strong></div>
                <div class="receipt-line"><span>Vehicle:</span> <strong>${receipt.brand} ${receipt.model}</strong></div>
                <div class="receipt-line"><span>Period:</span> <strong>${receipt.start_date} to ${receipt.end_date}</strong></div>
                <div class="receipt-line"><span>Method:</span> <strong>${receipt.method}</strong></div>
            `;
            document.getElementById('receiptTotal').textContent = `₱${receipt.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('receiptModal').style.display = 'flex';
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            
            btn.disabled = true;
            btn.textContent = 'Processing...';

            try {
                if (splitId) {
                    // Split Bill Payment Logic
                    const response = await fetch('/api/split-bill/pay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ split_id: splitId })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        msg.innerHTML = '<span class="success">Split payment recorded! Redirecting...</span>';
                        localStorage.removeItem('paying_split_id');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html'; 
                        }, 1500);
                    } else {
                        throw new Error(data.error || 'Failed to process split payment.');
                    }
                } else {
                    // Normal Booking Payment Logic
                    const formData = new FormData();
                    formData.append('booking_id', bookingId);
                    formData.append('amount', amount);
                    formData.append('method', document.getElementById('method').value);
                    formData.append('reference_number', document.getElementById('referenceNumber').value);
                    
                    const fileInput = document.getElementById('paymentProof');
                    if (fileInput.files.length > 0) {
                        formData.append('payment_proof', fileInput.files[0]);
                    }

                    const response = await fetch('/api/payment', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        if (data.receipt) {
                            showReceipt(data.receipt);
                        } else {
                            msg.innerHTML = '<span class="success">Payment recorded! Redirecting...</span>';
                            setTimeout(() => {
                                window.location.href = 'booking-confirmation.html';
                            }, 1500);
                        }
                    } else {
                        throw new Error(data.error || 'Failed to process payment.');
                    }
                }
            } catch (err) {
                msg.innerHTML = `<span class="error">${err.message || 'Server error.'}</span>`;
                btn.disabled = false;
                btn.textContent = 'Confirm Payment';
            }
        });
    </script>
</body>
</html>
