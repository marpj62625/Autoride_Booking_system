<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Contact - Autoride</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5849C4;
            --secondary: #00CEC9;
            --bg-color: #0F172A;
            --surface: #1E293B;
            --surface-accent: rgba(255, 255, 255, 0.05);
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 206, 201, 0.15) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            position: relative;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.3s;
        }

        input, select, textarea {
            width: 100%;
            background: var(--surface-accent);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .form-group:focus-within label {
            color: var(--primary);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(108, 92, 231, 0.5);
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(108, 92, 231, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .decorative-blob {
            position: absolute;
            background: linear-gradient(to right, #6C5CE7, #00CEC9);
            filter: blur(80px);
            opacity: 0.3;
            z-index: -1;
            border-radius: 50%;
            animation: pulse 8s infinite alternate;
        }

        #blob1 {
            width: 200px; height: 200px; top: -50px; left: -50px;
        }
        
        #blob2 {
            width: 150px; height: 150px; bottom: -20px; right: -20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.5; }
        }

        .alert-success {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34D399;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
    </style>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <div class="decorative-blob" id="blob1"></div>
        <div class="decorative-blob" id="blob2"></div>

        <div class="glass-panel">
            <h1>Get Support</h1>
            <p class="subtitle">Have an issue? Submit a ticket and our team will get back to you immediately.</p>

            <div class="alert-success" id="successMsg">
                Your ticket has been submitted successfully! We'll reply shortly.
            </div>

            <form id="supportForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="subject">Subject / Issue</label>
                    <select id="subject" required style="color: #94A3B8;">
                        <option value="" disabled selected>Select an issue...</option>
                        <option value="Booking Modification" style="color: black;">Booking Modification</option>
                        <option value="Vehicle Issue" style="color: black;">Vehicle Issue</option>
                        <option value="Payment Inquiry" style="color: black;">Payment Inquiry</option>
                        <option value="Other" style="color: black;">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Detailed Message</label>
                    <textarea id="message" rows="5" required placeholder="Please describe your issue in detail..."></textarea>
                </div>

                <button type="submit">Submit Ticket</button>
            </form>
        </div>
    </div>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://fydfsgjrlowrrtlmefwq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5ZGZzZ2pybG93cnJ0bG1lZndxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMjkwNTcsImV4cCI6MjA5MDYwNTA1N30.m94HHMC7852zw9xfkkOYTPY1IzoH_kNPLYpTe0myGB4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Subscribe to Support Replie changes
        supabaseClient
            .channel('realtime-support')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'contact_queries' }, payload => {
                if (payload.new.admin_reply) {
                    alert(`NOTIFICATION: You have a new reply to your support ticket: "${payload.new.subject}"`);
                }
            })
            .subscribe();

        document.getElementById('subject').addEventListener('change', function() {
            this.style.color = '#fff';
        });

        document.getElementById('supportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Submitting...';
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            // Mock submission delay
            await new Promise(r => setTimeout(r, 1200));

            try {
                const response = await fetch('http://127.0.0.1:9999/api/support', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, subject, message })
                });

                if (response.ok) {
                    document.getElementById('successMsg').style.display = 'block';
                    e.target.reset();
                    document.getElementById('subject').style.color = '#94A3B8';
                }
            } catch (err) {
                console.error("Support submission failed:", err);
            }

            btn.textContent = originalText;
            btn.disabled = false;
        });
    </script>
    <script src="chat.js"></script>
</body>
</html>
