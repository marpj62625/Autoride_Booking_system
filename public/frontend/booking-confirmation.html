<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | Autoride</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
    <style>
        .success-icon {
            color: var(--success);
            margin: 0 auto 1.5rem auto;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Autoride</h1>
        <nav>
            <a href="dashboard.html">Go to Dashboard</a>
        </nav>
    </header>

    <div class="auth-container" style="max-width: 500px; text-align: center;">
        <div class="success-icon">
            <svg width="80" height="80" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        
        <h2>Booking Confirmed!</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Your vehicle has been successfully reserved and payment is recorded.</p>
        
        <div style="background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 8px; text-align: left; border: 1px solid var(--border-color); margin-bottom: 2rem;">
            <p style="margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
                <span style="color: var(--text-muted);">Reference Number:</span>
                <strong id="confirmRef">-</strong>
            </p>
            <p style="margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
                <span style="color: var(--text-muted);">Date:</span>
                <strong id="confirmDate">-</strong>
            </p>
            <p style="margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
                <span style="color: var(--text-muted);">Time:</span>
                <strong id="confirmTime">-</strong>
            </p>
            <p style="margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
                <span style="color: var(--text-muted);">Total Paid:</span>
                <strong id="confirmAmount" style="color: var(--primary-color);">-</strong>
            </p>
            <p style="margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
                <span style="color: var(--text-muted);">Status:</span>
                <span class="status-badge status-available">Confirmed</span>
            </p>
        </div>

        <a href="dashboard.html" class="btn">View My Dashboard</a>
    </div>

    <script>
        const ref = localStorage.getItem('receipt_ref');
        const amount = localStorage.getItem('current_amount');
        const date = localStorage.getItem('receipt_date');
        const time = localStorage.getItem('receipt_time');

        if (amount) {
            document.getElementById('confirmRef').textContent = ref || "N/A";
            document.getElementById('confirmAmount').textContent = `₱${parseFloat(amount).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('confirmDate').textContent = date || "N/A";
            document.getElementById('confirmTime').textContent = time || "N/A";
            
            // Clear current receipt info so it isn't reused accidentally
            localStorage.removeItem('receipt_ref');
            localStorage.removeItem('receipt_date');
            localStorage.removeItem('receipt_time');
            localStorage.removeItem('current_amount');
        } else {
            document.getElementById('confirmRef').textContent = "Unknown";
        }
    </script>
</body>
</html>
