<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management - Autoride Admin</title>
    <link rel="stylesheet" href="vehicle-management.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Vehicle Management</h1>
            <p>Add, edit, delete, and view all vehicles</p>
        </header>

        <section class="card">
            <h2 id="formTitle">Add New Vehicle</h2>
            <form id="vehicleForm">
                <div class="grid">
                    <label>
                        Name
                        <input id="name" type="text" required>
                    </label>
                    <label>
                        Model
                        <input id="model" type="text" required>
                    </label>
                    <label>
                        Category
                        <select id="vehicle_type" required>
                            <option value="">Select Category</option>
                            <option value="Sedan">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="Van">Van</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="Pick-up">Pick-up</option>
                            <option value="MPV">MPV</option>
                            <option value="Motorcycle">Motorcycle</option>
                        </select>
                    </label>
                    <label>
                        Price per day
                        <input id="pricePerDay" type="number" min="0" step="0.01" required>
                    </label>
                    <label>
                        Availability
                        <select id="availability" required>
                            <option value="Available">Available</option>
                            <option value="Booked">Booked</option>
                            <option value="Unavailable">Unavailable</option>
                        </select>
                    </label>
                    <label class="full">
                        Image URL (optional)
                        <input id="image" type="text" placeholder="https://example.com/car.jpg">
                    </label>
                </div>
                <div class="actions">
                    <button id="submitBtn" type="submit">Add Vehicle</button>
                    <button id="cancelEditBtn" type="button" class="hidden">Cancel Edit</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="table-header">
                <h2>All Vehicles</h2>
                <button id="refreshBtn" type="button">Refresh</button>
            </div>
            <div class="table-wrap">
                <table id="vehiclesTable">
                    <thead>
                        <tr>
                            <th>Plate #</th>
                            <th>Name</th>
                            <th>Model</th>
                            <th>Category</th>
                            <th>Price/Day</th>
                            <th>Availability</th>
                            <th>Image</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="vehiclesBody"></tbody>
                </table>
            </div>
            <p id="emptyState" class="empty hidden">No vehicles found.</p>
            <p id="loadingState" class="loading">Loading vehicles...</p>
        </section>
    </main>

    <script src="vehicle-management.js"></script>
</body>
</html>
