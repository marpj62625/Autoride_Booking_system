name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'customer_mobile/www/**'
      - 'customer_mobile/capacitor.config.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: customer_mobile/package-lock.json

      # 3. Install Capacitor dependencies
      - name: Install npm dependencies
        working-directory: customer_mobile
        run: npm ci

      # 4. Add iOS platform if not already present
      - name: Add iOS platform
        working-directory: customer_mobile
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists, skipping add"
          fi

      # 5. Sync web assets into iOS project
      - name: Sync Capacitor iOS
        working-directory: customer_mobile
        run: npx cap sync ios

      # 6. Install CocoaPods dependencies
      - name: Install CocoaPods
        working-directory: customer_mobile/ios/App
        run: pod install

      # 7. Build unsigned IPA using xcodebuild
      - name: Build iOS (unsigned)
        working-directory: customer_mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/Autoride.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      # 8. Export IPA (unsigned, for sideloading)
      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa-output
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/Autoride.xcarchive \
            -exportPath $RUNNER_TEMP/ipa-output \
            -exportOptionsPlist $GITHUB_WORKSPACE/.github/workflows/ExportOptions.plist

      # 9. Upload IPA as artifact (downloadable from GitHub Actions)
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autoride-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa-output/*.ipa
          retention-days: 30
          if-no-files-found: error
