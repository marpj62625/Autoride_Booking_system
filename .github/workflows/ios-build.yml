name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: customer_mobile
        run: npm ci

      - name: Add iOS platform
        working-directory: customer_mobile
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists"
          fi

      - name: Sync Capacitor iOS
        working-directory: customer_mobile
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: customer_mobile/ios/App
        run: pod install

      - name: Build iOS archive (unsigned)
        working-directory: customer_mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Autoride.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA from archive
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/Autoride.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Autoride.ipa Payload
          echo "IPA created at $RUNNER_TEMP/Autoride.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autoride-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/Autoride.ipa
          retention-days: 30
          if-no-files-found: error
