name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: customer_mobile
        run: npm ci

      - name: Add iOS platform
        working-directory: customer_mobile
        run: npx cap add ios || true

      - name: Sync Capacitor iOS
        working-directory: customer_mobile
        run: npx cap sync ios

      - name: Resolve Swift Package dependencies
        working-directory: customer_mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build iOS archive (unsigned)
        working-directory: customer_mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Autoride.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            archive

      - name: Package IPA from archive
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/Autoride.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Autoride.ipa Payload
          ls -la Autoride.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Autoride-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/Autoride.ipa
          retention-days: 30
          if-no-files-found: error
